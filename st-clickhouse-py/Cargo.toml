[package]
name = "st-clickhouse-py"
version = "0.1.0"
description = "Python bindings for st-clickhouse — ClickHouse native protocol"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/Stellarrion/st-clickhouse-lib"
keywords = ["clickhouse", "database", "python", "bindings"]
categories = ["database"]
publish = false

[lib]
name = "st_clickhouse_python"
crate-type = ["cdylib"]

[lints.rust]
deprecated = "allow"
dead_code = "allow"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "deny"
panic = "deny"
cast_lossless = "allow"
cast_sign_loss = "deny"
type_complexity = "allow"
large_enum_variant = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
large_digit_groups = "allow"
fn_params_excessive_bools = "allow"
wildcard_dependencies = "deny"
multiple_crate_versions = "allow"

[dependencies]
st-clickhouse = { package = "st-clickhouse-lib", version = "0.1", path = "..", default-features = false, features = ["lz4", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
# PyO3 with abi3 (stable ABI) for Python 3.12+ GIL builds.
# Python free-threaded builds use version-specific extension artifacts.
pyo3 = { version = "0.28.3", features = ["abi3-py312", "generate-import-lib"] }
