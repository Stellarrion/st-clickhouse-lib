[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Metadata mirrors st-clickhouse-py/Cargo.toml (name/version/license/description).
# `version` must stay literal here: .github/workflows/ci.yml (version-check job)
# parses it with sed and gates releases on Cargo.toml/pyproject.toml agreement.
# description uses the exact Cargo.toml string to prevent wording drift.
name = "st-clickhouse-py"
version = "0.2.0"
description = "Python bindings for st-clickhouse — ClickHouse native protocol"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
keywords = ["clickhouse", "database", "native-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/Stellarrion/st-clickhouse-lib"
Repository = "https://github.com/Stellarrion/st-clickhouse-lib"
Documentation = "https://github.com/Stellarrion/st-clickhouse-lib"

[project.optional-dependencies]
test = ["maturin>=1.7,<2.0", "pytest>=7", "pytest-asyncio", "pytest-timeout"]

[tool.maturin]
# Use the stable ABI for Python 3.12+ GIL-build compatibility.
# Free-threaded Python builds produce version-specific extension artifacts.
features = ["pyo3/abi3-py312", "pyo3/extension-module"]
module-name = "st_clickhouse._native"
bindings = "pyo3"
python-source = "python"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
